# Auto-generated by NativeFlow Studio. Do not edit by hand.
workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Expo prebuild
        script: npx expo prebuild --platform android --clean --no-install
      - name: Gradle assemble
        script: |
          cd android
          # Honor BUILD_VARIANT injected by the orchestrator: 'debug' -> assembleDebug,
          # anything else (including unset) -> assembleRelease. Preview APK builds
          # send 'debug' so they produce a debuggable, unsigned APK; release builds
          # send 'release'.
          VARIANT_RAW="${BUILD_VARIANT:-release}"
          case "$VARIANT_RAW" in
            debug|Debug|DEBUG) GRADLE_TASK="assembleDebug" ;;
            *) GRADLE_TASK="assembleRelease" ;;
          esac
          # For debug builds, strip any release-signing env so a missing keystore
          # cannot mask the real failure with a "keystore not found" error.
          if [ "$GRADLE_TASK" = "assembleDebug" ]; then
            unset NATIVEFLOW_UPLOAD_STORE_FILE NATIVEFLOW_UPLOAD_STORE_PASSWORD \
                  NATIVEFLOW_UPLOAD_KEY_ALIAS NATIVEFLOW_UPLOAD_KEY_PASSWORD
            # Preview/debug APKs run headlessly on a CI host with no Metro server.
            # React Native's Gradle plugin treats variants listed in `debuggableVariants`
            # (default: ["debug"]) as Metro-dependent and skips JS/asset bundling for them,
            # so a plain assembleDebug produces an APK that crashes with
            # "Unable to load script ... index.android.bundle" on launch.
            # Patch the generated app/build.gradle to set `debuggableVariants = []` inside
            # the `react { ... }` block so Gradle's own bundling task runs for the debug
            # variant, exactly like it does for release. This is the supported RN gotcha fix.
            echo "Patching app/build.gradle: debuggableVariants = []"
            perl -0pi -e 's/(react\s*\{)/$1\n    debuggableVariants = []/' app/build.gradle
            grep -n "debuggableVariants" app/build.gradle || { echo "ERROR: failed to patch build.gradle -- react {} block not found"; exit 1; }
          fi
          # Give Gradle enough heap to compile RN + Kotlin on the free tier and
          # always emit --stacktrace/--info so the failure block is diagnosable.
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          # Honor ANDROID_ARCH: 'all' -> universal (no filter); anything else
          # -> pass the value straight through as -PreactNativeArchitectures.
          ARCH_RAW="${ANDROID_ARCH:-arm64-v8a}"
          ARCH_ARGS=""
          if [ "$ARCH_RAW" != "all" ]; then
            ARCH_ARGS="-PreactNativeArchitectures=$ARCH_RAW"
          fi
          echo "Running ./gradlew $GRADLE_TASK (BUILD_VARIANT=$VARIANT_RAW, ANDROID_ARCH=$ARCH_RAW)"
          ./gradlew "$GRADLE_TASK" $ARCH_ARGS --stacktrace --info --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.apk

  android-aab:
    name: Android AAB
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Expo prebuild
        script: npx expo prebuild --platform android --clean --no-install
      - name: Gradle bundle
        script: |
          cd android
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          ARCH_RAW="${ANDROID_ARCH:-all}"
          ARCH_ARGS=""
          if [ "$ARCH_RAW" != "all" ]; then
            ARCH_ARGS="-PreactNativeArchitectures=$ARCH_RAW"
          fi
          echo "Running ./gradlew bundleRelease (ANDROID_ARCH=$ARCH_RAW)"
          ./gradlew bundleRelease $ARCH_ARGS --stacktrace --info --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.aab

  ios-ipa:
    name: iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Expo prebuild
        script: npx expo prebuild --platform ios --clean
      - name: Pod install
        script: |
          cd ios
          pod install
      - name: Signing setup
        script: |
          # IOS_SIGNING is set by the orchestrator: 'signed' only when App Store
          # Connect API credentials were supplied. Otherwise build unsigned.
          if [ "${IOS_SIGNING:-unsigned}" = "signed" ]; then
            keychain initialize
            app-store-connect fetch-signing-files "$IOS_BUNDLE_ID" --type IOS_APP_STORE --create \
              || { echo "ERROR: Apple signing failed. Check the App Store Connect API key and bundle ID."; exit 1; }
            keychain add-certificates
            xcode-project use-profiles
          else
            echo "No Apple signing configured: producing an UNSIGNED IPA (cannot be installed until signed)."
          fi
      - name: Xcode archive
        script: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          if [ -z "$WORKSPACE" ]; then echo "ERROR: no .xcworkspace produced by expo prebuild"; exit 1; fi
          SCHEME="${XCODE_SCHEME:-${WORKSPACE%.xcworkspace}}"
          echo "Archiving workspace=$WORKSPACE scheme=$SCHEME signing=${IOS_SIGNING:-unsigned}"
          if [ "${IOS_SIGNING:-unsigned}" = "signed" ]; then
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
              -sdk iphoneos -configuration Release \
              -archivePath build/App.xcarchive archive \
              || { echo "ERROR: iOS archive failed."; exit 1; }
          else
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
              -sdk iphoneos -configuration Release \
              -archivePath build/App.xcarchive archive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              || { echo "ERROR: iOS archive failed."; exit 1; }
          fi
      - name: Export IPA
        script: |
          cd ios
          mkdir -p build/ipa
          if [ "${IOS_SIGNING:-unsigned}" = "signed" ]; then
            xcode-project build-ipa --archive build/App.xcarchive --ipa-directory build/ipa \
              || { echo "ERROR: IPA export failed."; exit 1; }
          else
            APP=$(ls -d build/App.xcarchive/Products/Applications/*.app | head -n 1)
            if [ -z "$APP" ]; then echo "ERROR: no .app in archive"; exit 1; fi
            rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
            zip -qry build/ipa/App-unsigned.ipa Payload
          fi
          ls build/ipa/*.ipa >/dev/null 2>&1 || { echo "ERROR: no IPA produced"; exit 1; }
    artifacts:
      - ios/build/ipa/*.ipa
      - ios/build/App.xcarchive
